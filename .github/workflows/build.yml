name: Build Zalo for Linux

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      zalo_version:
        description: 'Zalo Version (leave empty for latest)'
        required: false
        default: ''
        type: string
      zadark_version:
        description: 'ZaDark Version/Tag/Commit (leave empty for latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Cache Electron binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-
          
    - name: Install Node.js dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblzma-dev

    - name: Setup and Build
      id: build
      env:
        ZALO_VERSION: ${{ github.event.inputs.zalo_version }}
        ZADARK_VERSION: ${{ github.event.inputs.zadark_version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: npm run main

    - name: Add AppImageUpdate metadata
      if: steps.build.outputs.build == 'true'
      env:
        ORIGINAL_APPIMAGE: ${{ steps.build.outputs.original_appimage_file }}
        ZADARK_APPIMAGE: ${{ steps.build.outputs.zadark_appimage_file }}
        ORIGINAL_ZSYNC: dist/Zalo-Original.AppImage.zsync
        ZADARK_ZSYNC: dist/Zalo-ZaDark.AppImage.zsync
      run: |
        set -euo pipefail

        curl --fail --location --retry 3 \
          --output appimagetool.AppImage \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool.AppImage

        owner="${GITHUB_REPOSITORY%%/*}"
        repository="${GITHUB_REPOSITORY#*/}"

        make_updateable() {
          local appimage="$1"
          local filename
          local zsync_asset="$2"
          local workdir

          filename="$(basename "$appimage")"
          workdir="$(mktemp -d)"

          (
            cd "$workdir"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
            ARCH=x86_64 "${GITHUB_WORKSPACE}/appimagetool.AppImage" \
              --appimage-extract-and-run \
              -u "gh-releases-zsync|${owner}|${repository}|latest|$(basename "$zsync_asset")" \
              squashfs-root "${filename}"
          )

          mv "${workdir}/${filename}" "$appimage"
          mv "${workdir}/${filename}.zsync" "$zsync_asset"
          rm -rf "$workdir"
        }

        make_updateable "$ORIGINAL_APPIMAGE" "$ORIGINAL_ZSYNC"
        make_updateable "$ZADARK_APPIMAGE" "$ZADARK_ZSYNC"

        test -s "$ORIGINAL_ZSYNC"
        test -s "$ZADARK_ZSYNC"
        
    - name: Upload Original AppImage artifact
      if: steps.build.outputs.build == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.original_appimage_name }}
        path: |
          ${{ steps.build.outputs.original_appimage_file }}
          dist/Zalo-Original.AppImage.zsync
        retention-days: 30
        
    - name: Upload ZaDark AppImage artifact
      if: steps.build.outputs.build == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.zadark_appimage_name }}
        path: |
          ${{ steps.build.outputs.zadark_appimage_file }}
          dist/Zalo-ZaDark.AppImage.zsync
        retention-days: 30
        
    - name: Create Release
      if: steps.build.outputs.build == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.build.outputs.zalo_version }}
        name: ${{ steps.build.outputs.zalo_version }}
        body: |
          ## 🚀 How to use
          
          It is recommended to use [Gear Lever](https://github.com/mijorus/gearlever) to manage and integrate the AppImage.

          ```bash
          # Download the AppImage
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.build.outputs.zalo_version }}/${{ steps.build.outputs.zadark_appimage_name }}

          # Install with Gear Lever
          flatpak run it.mijorus.gearlever --integrate ${{ steps.build.outputs.zadark_appimage_name }}
          ```

          ## 📋 System Requirements
          - Linux x64
          - GLIBC 2.28 or later
          
          ## 🐛 Issues & Support
          Please report issues in the [GitHub Issues](https://github.com/${{ github.repository }}/issues) section.

        files: |
          ${{ steps.build.outputs.original_appimage_file }}
          dist/Zalo-Original.AppImage.zsync
          ${{ steps.build.outputs.zadark_appimage_file }}
          dist/Zalo-ZaDark.AppImage.zsync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup old release assets
      if: steps.build.outputs.build == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.build.outputs.zalo_version }}
        ORIGINAL_APPIMAGE_NAME: ${{ steps.build.outputs.original_appimage_name }}
        ZADARK_APPIMAGE_NAME: ${{ steps.build.outputs.zadark_appimage_name }}
      run: |
        set -euo pipefail

        echo "Cleaning up superseded assets for release $RELEASE_TAG"

        asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' || true)

        if [ -z "$asset_names" ]; then
          echo "No assets found for release $RELEASE_TAG"
          exit 0
        fi

        for name in $asset_names; do
          if [[ "$name" == Zalo-*.AppImage || "$name" == Zalo-*.AppImage.zsync ]] && \
             [[ "$name" != "$ORIGINAL_APPIMAGE_NAME" ]] && \
             [[ "$name" != "Zalo-Original.AppImage.zsync" ]] && \
             [[ "$name" != "$ZADARK_APPIMAGE_NAME" ]] && \
             [[ "$name" != "Zalo-ZaDark.AppImage.zsync" ]]; then
            echo "Removing old asset: $name"
            gh release delete-asset "$RELEASE_TAG" "$name" --yes
          fi
        done
